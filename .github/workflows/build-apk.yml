name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar as dependências (Capacitor precisa do node_modules)
        run: npm ci

      - name: Configurar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar o APK (debug, pronto pra instalar)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pulso.apk

      - name: Disponibilizar o APK pra download (dentro do GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: pulso-app
          path: pulso.apk
          retention-days: 30

      - name: Publicar como Release (link público pra baixar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: pulso (Android)
          body: |
            APK mais recente do app Android do pulso.
            Baixe o arquivo pulso.apk abaixo e instale no celular
            (pode pedir pra permitir "fontes desconhecidas").
          files: pulso.apk
          prerelease: true
          # Sempre atualiza a mesma release em vez de criar uma nova a
          # cada push, assim o link de download nunca muda.
          make_latest: true
